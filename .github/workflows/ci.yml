name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `build` validates the repository first: fast, and it catches the class
      # of mistake that would otherwise surface as a confusing test failure.
      - name: Production build
        run: npm run build

      # ARCHITECTURE.md §23. Warns rather than fails, so a justified increase
      # is not a blocked deploy.
      - name: Check bundle sizes
        run: node scripts/check-bundles.js

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Runs against the built output via vite preview, because dev mode is not
      # sufficient for final verification (GAME-TESTING.md §18).
      - name: Browser tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Keeps the scaffold from going stale: scaffold a throwaway game, validate,
  # smoke-test it, then delete it and prove the tree is clean. A separate job
  # because it mutates the working tree, which must never reach the deploy path.
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scaffold a probe game
        run: node scripts/new-game.js ci-probe

      # Validation requires the og image on disk (§29), so borrow one. The
      # scaffold's `st-todo` sticker symbol is added by hand normally, so stage
      # it here and revert it below alongside the registry.
      - name: Stage placeholder art
        run: |
          cp public/assets/untangle-og.jpg public/assets/ci-probe-og.jpg
          node -e '
            const fs = require("fs");
            const p = "scripts/sprite.svg";
            const symbol =
              `<symbol id="st-todo" viewBox="0 0 48 48">` +
              `<circle cx="24" cy="24" r="13" fill="currentColor"/></symbol>\n`;
            fs.writeFileSync(p, fs.readFileSync(p, "utf8").replace("</svg>", symbol + "</svg>"));
          '

      - name: Validate the scaffolded repository
        run: npm run validate

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # The probe's own smoke tests. `-g` matches the per-game describe block in
      # tests/smoke/site.spec.js, which is named after the slug.
      - name: Smoke-test the probe
        run: npx playwright test tests/smoke --project=desktop -g "ci-probe"

      - name: Remove the probe and prove the tree is clean
        if: always()
        run: |
          rm -rf src/ci-probe public/assets/ci-probe-*
          git checkout -- src/data/games.js scripts/sprite.svg
          git status --porcelain
          git diff --exit-code
