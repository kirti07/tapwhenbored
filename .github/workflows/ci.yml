name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Structural checks first: they are fast, and they catch the class of
      # mistake that would otherwise surface as a confusing test failure.
      - name: Validate repository
        run: npm run validate

      - name: Production build
        run: npm run build

      # Guards ARCHITECTURE.md §23. Deliberately a warning-level check on
      # per-page JS, not a hard cap, so a justified increase is a conversation
      # rather than a blocked deploy.
      - name: Check bundle sizes
        run: node scripts/check-bundles.js

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Runs against the built output via vite preview, because dev mode is not
      # sufficient for final verification (GAME-TESTING.md §18).
      - name: Browser tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A scaffold is a copy of the page template frozen at the moment someone last
  # edited it, so it goes stale silently — it once emitted `dvh` where §16 asks
  # for `svh`, and preloaded a webfont weight no new game renders. Nothing
  # failed, because nothing ran it. This runs it: scaffold a throwaway game,
  # give it placeholder art, validate, play its own smoke tests, then delete it
  # and prove the tree is clean again.
  #
  # A separate job from `verify` on purpose. It mutates the working tree, and a
  # mutated tree must never be what reaches the deploy path.
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scaffold a probe game
        run: node scripts/new-game.js ci-probe

      # Validation requires the og image on disk (§29), so borrow an existing
      # game's. The probe never renders it; it only has to resolve. There is no
      # thumbnail to stage — the shelf draws a glyph from the shared sprite.
      #
      # The scaffold writes `sticker: "st-TODO"` and tells the author to add the
      # symbol by hand, which is right for a person and impossible for CI. So
      # stage that too, and revert it below alongside the registry.
      - name: Stage placeholder art
        run: |
          cp public/assets/untangle-og.jpg public/assets/ci-probe-og.jpg
          node -e '
            const fs = require("fs");
            const p = "scripts/sprite.svg";
            const symbol =
              `<symbol id="st-todo" viewBox="0 0 48 48">` +
              `<circle cx="24" cy="24" r="13" fill="currentColor"/></symbol>\n`;
            fs.writeFileSync(p, fs.readFileSync(p, "utf8").replace("</svg>", symbol + "</svg>"));
          '

      - name: Validate the scaffolded repository
        run: npm run validate

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # The probe's own smoke tests. `-g` matches the per-game describe block in
      # tests/smoke/site.spec.js, which is named after the slug.
      - name: Smoke-test the probe
        run: npx playwright test tests/smoke --project=desktop -g "ci-probe"

      - name: Remove the probe and prove the tree is clean
        if: always()
        run: |
          rm -rf src/ci-probe public/assets/ci-probe-*
          git checkout -- src/data/games.js scripts/sprite.svg
          git status --porcelain
          git diff --exit-code
