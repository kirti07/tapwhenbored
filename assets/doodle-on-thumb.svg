<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefbf3"/>
      <stop offset="100%" stop-color="#f5eedc"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9a3d"/>
      <stop offset="22%" stop-color="#ff5f96"/>
      <stop offset="42%" stop-color="#a970ff"/>
      <stop offset="62%" stop-color="#4fb8ff"/>
      <stop offset="82%" stop-color="#2ee6b8"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.5" fill="#2b2620" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="640" height="640" fill="url(#paper)"/>
  <rect width="640" height="640" fill="url(#dots)"/>

  <!-- one continuous rainbow doodle -->
  <path d="M 150 470
           C 120 380, 150 300, 220 300
           C 300 300, 300 400, 380 400
           C 460 400, 460 300, 400 250
           C 340 200, 250 220, 230 170
           C 210 120, 280 90, 340 120
           C 410 155, 420 230, 480 230
           C 520 230, 520 180, 490 170"
        fill="none" stroke="url(#rainbow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- start dot -->
  <circle cx="150" cy="470" r="12" fill="#ff9a3d"/>

  <!-- a couple of sparkle accents -->
  <path d="M556 110 q0 18 18 18 q-18 0 -18 18 q0 -18 -18 -18 q18 0 18 -18Z" fill="#7c5cff"/>
  <path d="M80 330 q0 13 13 13 q-13 0 -13 13 q0 -13 -13 -13 q13 0 13 -13Z" fill="#ff5f96"/>
  <path d="M540 500 q0 10 10 10 q-10 0 -10 10 q0 -10 -10 -10 q10 0 10 -10Z" fill="#2ee6b8"/>
</svg>
