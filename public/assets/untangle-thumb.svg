<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#fff6f3"/>
      <stop offset="45%" stop-color="#fbe4dd"/>
      <stop offset="100%" stop-color="#f2c7ba"/>
    </radialGradient>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- untangled outer edges -->
  <g stroke="#c9998b" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="160" y1="190" x2="470" y2="160"/>
    <line x1="470" y1="160" x2="500" y2="470"/>
    <line x1="500" y1="470" x2="330" y2="560"/>
    <line x1="330" y1="560" x2="150" y2="460"/>
    <line x1="150" y1="460" x2="160" y2="190"/>
  </g>

  <!-- crossing chords -->
  <g stroke="#ef6a55" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="160" y1="190" x2="500" y2="470"/>
    <line x1="470" y1="160" x2="150" y2="460"/>
    <line x1="330" y1="560" x2="330" y2="320"/>
  </g>
  <circle cx="352" cy="330" r="8" fill="#d84f3b" opacity="0.55"/>

  <g fill="#2b2320">
    <circle cx="160" cy="190" r="26"/>
    <circle cx="470" cy="160" r="26"/>
    <circle cx="500" cy="470" r="26"/>
    <circle cx="330" cy="560" r="26"/>
    <circle cx="150" cy="460" r="26"/>
    <circle cx="330" cy="320" r="26"/>
  </g>
</svg>
